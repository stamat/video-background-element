# Blank issues are off so that "it doesn't work" arrives with a version and a
# reproduction attached. Turn them back on if the forms start costing you
# reports you wanted — on a small project that happens.
blank_issues_enabled: false

contact_links:
  - name: Question or idea
    url: https://github.com/stamat/video-background-element/discussions
    about: Anything that isn't a bug or a concrete feature. Enable Discussions first, or delete this link.
  - name: Security vulnerability
    url: https://github.com/stamat/video-background-element/security/advisories/new
    about: Report it privately. Do not open a public issue.
